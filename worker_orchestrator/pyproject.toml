[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runner-worker-orchestrator"
version = "0.1.0"
description = "Persistent runner-side orchestrator for Master assignments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
worker-orchestrator = "worker_orchestrator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
