name: "HA Grok Bridge"
version: "0.2.3"
slug: ha_grok_bridge
description: "Pollt command.json und führt Whitelist-Befehle lokal auf /config aus. Ersatz für ki2. Keine HTTP-API."
url: "https://github.com/nicofroeba16-cell/ha-grok-bridge"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: manual
watchdog: false
hassio_api: true
hassio_role: manager
homeassistant_api: false
privileged: false
host_network: false
backup_exclude:
  - ssh
  - .ssh
  - last_id
  - bridge-push
map:
  - type: homeassistant_config
    read_only: false
  - type: ssl
    read_only: true
options:
  poll_interval: 15
  git_repo: "git@github.com:nicofroeba16-cell/ha-grok-bridge.git"
schema:
  poll_interval: int(5,120)
  git_repo: str
