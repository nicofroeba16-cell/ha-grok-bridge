name: Worker Orchestrator CI

on:
  push:
    branches:
      - "codex/worker-orchestrator-*"
    paths:
      - "worker_orchestrator/**"
      - ".github/workflows/worker-orchestrator.yml"
  pull_request:
    branches:
      - main
    paths:
      - "worker_orchestrator/**"
      - ".github/workflows/worker-orchestrator.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker_orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q src tests
