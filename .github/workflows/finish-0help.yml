name: finish-0help-autonomy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.run_number == 1 || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bridge
        shell: python
        run: |
          from pathlib import Path
          p = Path('ha_grok_bridge/file_bridge.py')
          s = p.read_text()
          if 'CONTROL_DIR = ".ai-control"' not in s:
              s = s.replace('PORT = 8099\n', 'PORT = 8099\nCONTROL_DIR = ".ai-control"\nCONTROL_COMMANDS = Path(CONTROL_DIR) / "commands"\nCONTROL_RESULTS = Path(CONTROL_DIR) / "results"\nMAX_CONTROL_COMMANDS = 10\n')
          s = s.replace('VERSION = "1.11"', 'VERSION = "1.12"', 1)
          old = '".cache", "secrets.yaml",'
          if old in s and '".ai-control"' not in s:
              s = s.replace(old, '".cache", ".ai-control", "secrets.yaml",', 1)
          old_prepare = '''def prepare_from_config(c):\n    if WORK.exists():\n        for p in list(WORK.iterdir()):\n            if p.name != ".git":\n                shutil.rmtree(p) if p.is_dir() else p.unlink()\n    count = 0\n    for src in CONFIG.iterdir():\n        if excluded(src.name, c):\n            continue\n        dst = WORK / src.name\n        shutil.copytree(src, dst, ignore=ignore(c)) if src.is_dir() else shutil.copy2(src, dst)\n        count += 1\n    return count\n'''
          new_prepare = '''def prepare_from_config(c):\n    control = WORK / CONTROL_DIR\n    preserve = DATA / "control-preserve"\n    if preserve.exists():\n        shutil.rmtree(preserve, ignore_errors=True)\n    if control.exists():\n        shutil.copytree(control, preserve)\n    if WORK.exists():\n        for p in list(WORK.iterdir()):\n            if p.name not in {".git", CONTROL_DIR}:\n                shutil.rmtree(p) if p.is_dir() else p.unlink()\n    count = 0\n    for src in CONFIG.iterdir():\n        if excluded(src.name, c):\n            continue\n        dst = WORK / src.name\n        shutil.copytree(src, dst, ignore=ignore(c)) if src.is_dir() else shutil.copy2(src, dst)\n        count += 1\n    if preserve.exists():\n        if control.exists():\n            shutil.rmtree(control)\n        shutil.copytree(preserve, control)\n        shutil.rmtree(preserve, ignore_errors=True)\n    return count\n'''
          if old_prepare in s:
              s = s.replace(old_prepare, new_prepare, 1)
          marker = '\ndef sync(c, forced=None):\n'
          if 'def process_ai_control(c, branch, dry):' not in s:
              helpers = r'''

def remote_config_changed(last, remote, c):
    if not last or not remote or last == remote:
        return False
    names = git(["diff", "--name-only", last, remote], check=False).stdout.splitlines()
    return any(not ignored(Path(name), c) for name in names)


def _control_result(results_dir, command_id, result):
    results_dir.mkdir(parents=True, exist_ok=True)
    safe = re.sub(r"[^A-Za-z0-9._-]", "_", str(command_id)) or "command"
    save(results_dir / f"{safe}.json", {"id": str(command_id), "completed_at": now(), **result})


def _control_read(path_value, c, encoding="utf-8"):
    target = safe_config_path(path_value, c)
    if not target.exists() or not target.is_file():
        raise ValueError("file not found")
    data = target.read_bytes()
    if len(data) > MAX_READ_BYTES:
        raise ValueError(f"file too large to read via control queue (max {MAX_READ_BYTES} bytes)")
    scan_dir = DATA / "control-read-scan"
    shutil.rmtree(scan_dir, ignore_errors=True)
    scan_dir.mkdir(parents=True, exist_ok=True)
    scan_file = scan_dir / (target.name or "read.txt")
    scan_file.write_bytes(data)
    findings = secret_scan(scan_dir, c)
    shutil.rmtree(scan_dir, ignore_errors=True)
    digest = hashlib.sha256(data).hexdigest()
    rel = "/config/" + target.relative_to(CONFIG).as_posix()
    if findings:
        return {"ok": False, "path": rel, "bytes": len(data), "sha256": digest, "error": "SECURITY BLOCKED: read result contains secret-like material"}
    if encoding.lower() == "base64":
        return {"ok": True, "path": rel, "bytes": len(data), "sha256": digest, "encoding": "base64", "content_base64": base64.b64encode(data).decode("ascii")}
    try:
        return {"ok": True, "path": rel, "bytes": len(data), "sha256": digest, "encoding": "utf-8", "content": data.decode("utf-8")}
    except UnicodeDecodeError:
        return {"ok": True, "path": rel, "bytes": len(data), "sha256": digest, "encoding": "base64", "content_base64": base64.b64encode(data).decode("ascii")}


def process_ai_control(c, branch, dry):
    commands_dir = WORK / CONTROL_COMMANDS
    results_dir = WORK / CONTROL_RESULTS
    if not commands_dir.is_dir():
        return
    for command_path in sorted(commands_dir.glob("*.json"))[:MAX_CONTROL_COMMANDS]:
        command_id = command_path.stem
        try:
            command = json.loads(command_path.read_text(encoding="utf-8"))
            if not isinstance(command, dict):
                raise ValueError("command must be a JSON object")
            action = str(command.get("action", "")).strip().lower()
            if action not in {"read", "write", "browse", "sync"}:
                raise ValueError("unsupported action")
            if action == "read":
                result = _control_read(command.get("path", ""), c, str(command.get("encoding", "utf-8")))
            elif action == "write":
                result = write_file(command, c)
            elif action == "browse":
                result = browse(command.get("path", "."), c)
            else:
                result = {"ok": True, "commit": remote_head(branch), "config_hash": treehash(CONFIG, c)}
            command_path.unlink(missing_ok=True)
            _control_result(results_dir, command_id, {"action": action, **result})
            if action == "write":
                findings = secret_scan(WORK, c)
                if findings:
                    raise RuntimeError(f"SECRET SCAN BLOCKED: {len(findings)} finding(s): {', '.join(findings[:5])}")
                snapshot(c)
                prepare_from_config(c)
            push(branch, dry, c, message=f"AI control: {action} {command_id}")
            log(f"AI control: completed {action} {command_id}")
        except Exception as exc:
            try:
                command_path.unlink(missing_ok=True)
                _control_result(results_dir, command_id, {"ok": False, "error": str(exc)})
                push(branch, dry, c, message=f"AI control: failed {command_id}")
            except Exception as result_exc:
                log(f"AI control result failed: {result_exc}")
            log(f"AI control ERROR {command_id}: {exc}")
'''
              s = s.replace(marker, helpers + marker, 1)
          s = s.replace('remote_changed = bool(last) and remote != last\n', 'remote_changed = bool(last) and remote != last\n        remote_config_change = remote_config_changed(last, remote, c)\n', 1)
          s = s.replace('if last and local_changed and remote_changed:\n', 'if last and local_changed and remote_config_change:\n', 1)
          s = s.replace('if mode == "git_to_ha" or (mode == "bidirectional" and remote_changed and not local_changed and bool(c.get("deploy_on_remote_change", True))):\n', 'if mode == "git_to_ha" or (mode == "bidirectional" and remote_config_change and not local_changed and bool(c.get("deploy_on_remote_change", True))):\n', 1)
          s = s.replace('            remote = head if not dry else remote\n        final = remote if remote else git(["rev-parse", "HEAD"]).stdout.strip()\n', '            remote = head if not dry else remote\n        process_ai_control(c, branch, dry)\n        remote = remote_head(branch)\n        final = remote if remote else git(["rev-parse", "HEAD"]).stdout.strip()\n', 1)
          p.write_text(s)
          q = Path('ha_grok_bridge/config.yaml')
          y = q.read_text()
          y = y.replace('version: "1.11"', 'version: "1.12"', 1)
          y = y.replace('description: Fully autonomous bidirectional Home Assistant /config synchronization with GitHub, automatic path-preserving deployment, arbitrary permitted files, AI-readable file API, snapshots, rollback, conflict detection and secret protection', 'description: Fully autonomous bidirectional Home Assistant /config synchronization with GitHub, AI command queue for read/write/browse/sync, arbitrary permitted files and nested paths, snapshots, rollback, conflict detection and secret protection', 1)
          y = y.replace('exclude_names: .git,.storage,.cloud,.HA_VERSION,.ssh,.cache,secrets.yaml,', 'exclude_names: .git,.storage,.cloud,.HA_VERSION,.ssh,.cache,.ai-control,secrets.yaml,', 1)
          q.write_text(y)
          print('patched 0-help autonomy to 1.12')
      - name: Commit generated changes
        run: |
          git config user.name "HA File Sync Bridge"
          git config user.email "ha-file-sync-bridge@localhost"
          git add ha_grok_bridge/file_bridge.py ha_grok_bridge/config.yaml
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete 0-help GitHub command queue autonomy"
          git push
