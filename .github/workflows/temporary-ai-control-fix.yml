name: Temporary AI control fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch push() message support
        shell: python
        run: |
          from pathlib import Path
          p = Path('ha_grok_bridge/file_bridge.py')
          s = p.read_text()
          old = 'def push(branch, dry, c):'
          new = 'def push(branch, dry, c, message=None):'
          if old not in s:
              raise SystemExit('push signature already patched or not found')
          s = s.replace(old, new, 1)
          old_commit = 'git(["commit", "-m", f"Sync Home Assistant /config - {now()}"])'
          new_commit = 'git(["commit", "-m", message or f"Sync Home Assistant /config - {now()}"])'
          if old_commit not in s:
              raise SystemExit('commit line not found')
          s = s.replace(old_commit, new_commit, 1)
          p.write_text(s)
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ha_grok_bridge/file_bridge.py
          git commit -m "Fix AI control result push message" || exit 0
          git push
