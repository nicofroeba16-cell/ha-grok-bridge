name: Activate Master Control Plane

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/activate-master-control.yml"
      - "worker_orchestrator/scripts/activate_master_control.sh"

permissions:
  contents: read

concurrency:
  group: worker-orchestrator-runtime-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Activate and verify Master control plane
        run: bash worker_orchestrator/scripts/activate_master_control.sh
