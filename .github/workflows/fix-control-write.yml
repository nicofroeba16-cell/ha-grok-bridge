name: fix-control-write
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix control transaction
        shell: python
        run: |
          from pathlib import Path
          p=Path('ha_grok_bridge/file_bridge.py')
          s=p.read_text()
          old='''            if action=="read": result=_control_read(command.get("path",""),c,str(command.get("encoding","utf-8")))\n            elif action=="write": result=write_file(command,c)\n            elif action=="browse": result=browse(command.get("path","."),c)\n            else: result={"ok":True,"commit":remote_head(branch),"config_hash":treehash(CONFIG,c)}\n            command_path.unlink(missing_ok=True); _control_result(results_dir,command_id,{"action":action,**result})\n            if action=="write":\n                findings=secret_scan(WORK,c)\n                if findings: raise RuntimeError(f"SECRET SCAN BLOCKED: {len(findings)} finding(s): {', '.join(findings[:5])}")\n                snapshot(c); prepare_from_config(c)\n            push(branch,dry,c,message=f"AI control: {action} {command_id}")\n'''
          new='''            previous = snapshot(c) if action == "write" else None\n            if action=="read": result=_control_read(command.get("path",""),c,str(command.get("encoding","utf-8")))\n            elif action=="write":\n                result=write_file(command,c)\n                prepare_from_config(c)\n                findings=secret_scan(WORK,c)\n                if findings:\n                    if previous is not None and bool(c.get("rollback_on_error", True)): restore_snapshot(previous,c)\n                    raise RuntimeError(f"SECRET SCAN BLOCKED: {len(findings)} finding(s): {', '.join(findings[:5])}")\n            elif action=="browse": result=browse(command.get("path","."),c)\n            else: result={"ok":True,"commit":remote_head(branch),"config_hash":treehash(CONFIG,c)}\n            command_path.unlink(missing_ok=True); _control_result(results_dir,command_id,{"action":action,**result})\n            push(branch,dry,c,message=f"AI control: {action} {command_id}")\n'''
          if old not in s: raise SystemExit('expected control block not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit and remove workflow
        run: |
          git config user.name "HA File Sync Bridge"
          git config user.email "ha-file-sync-bridge@localhost"
          git add ha_grok_bridge/file_bridge.py
          git rm -f .github/workflows/fix-control-write.yml
          git commit -m "fix: make AI control writes transactional and secret-safe"
          git push
