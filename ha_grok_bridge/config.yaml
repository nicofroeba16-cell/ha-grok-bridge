name: HA Grok Bridge
version: "0.5.1"
description: HA Grok Bridge file synchronization service
slug: ha_grok_bridge
url: https://github.com/nicofroeba16-cell/ha-grok-bridge
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
map:
  - type: ssl
    read_only: true
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  poll_interval: 60
  config_repo: git@github.com:nicofroeba16-cell/ha-grok-bridge-live.git
schema:
  poll_interval: int
  config_repo: str
