name: HA File Sync Bridge
version: "1.11"
description: Fully autonomous bidirectional Home Assistant /config synchronization with GitHub, automatic path-preserving deployment, arbitrary permitted files, AI-readable file API, snapshots, rollback, conflict detection and secret protection
slug: ha_grok_bridge
url: https://github.com/nicofroeba16-cell/ha-grok-bridge
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:sync
map:
  - type: ssl
    read_only: true
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  poll_interval: 60
  config_repo: git@github.com:nicofroeba16-cell/ha-grok-bridge-live.git
  branch: main
  sync_mode: bidirectional
  initial_sync: ha_to_git
  dry_run: false
  max_snapshots: 10
  exclude_names: .git,.storage,.cloud,.HA_VERSION,.ssh,.cache,secrets.yaml,home-assistant_v2.db,home-assistant_v2.db-shm,home-assistant_v2.db-wal,home-assistant_v2.db-journal,home-assistant.log,home-assistant.log.1,home-assistant.log.fault
  exclude_dirs: tts,media,backups
  exclude_suffixes: .passphrase,.pem,.key,.p12,.pfx
  secret_scan: true
  history_cleanup: false
  deploy_on_remote_change: true
  rollback_on_error: true
  auto_reload: false
schema:
  poll_interval: int
  config_repo: str
  branch: str
  sync_mode: list(bidirectional|ha_to_git|git_to_ha)
  initial_sync: list(ha_to_git|git_to_ha)
  dry_run: bool
  max_snapshots: int
  exclude_names: str
  exclude_dirs: str
  exclude_suffixes: str
  secret_scan: bool
  history_cleanup: bool
  deploy_on_remote_change: bool
  rollback_on_error: bool
  auto_reload: bool
